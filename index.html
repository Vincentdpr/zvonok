<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Звонок</title>
<!--
  Звонок один на один с демонстрацией экрана.
  Без своего сервера, без домена и без сторонних библиотек.

  Как устроено:
  • Видео, звук и чат идут напрямую между браузерами (WebRTC) и всегда
    зашифрованы (DTLS-SRTP).
  • Чтобы браузеры нашли друг друга, они обмениваются служебными
    сообщениями через публичные MQTT-серверы — сразу через несколько,
    чтобы работало из разных стран. Эти сообщения шифруются AES-256
    ключом из кода комнаты и пароля: сервер-посредник не видит ни IP,
    ни имён, ни содержимого.
  • В комнату никто не попадёт без подтверждения ведущего.
-->
<style>
  :root { --bg:#14161a; --panel:#1f2329; --line:#2e333b; --text:#e9ecf1; --muted:#9aa3ae; --accent:#e0a33a; --red:#d9534f; --green:#3fae6a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:10px; padding:10px 16px; }
  button:hover { border-color:var(--accent); }
  button:disabled { opacity:.55; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#1b1408; font-weight:600; }
  button.off { background:var(--red); border-color:var(--red); }
  button.on { background:var(--green); border-color:var(--green); }
  input { font:inherit; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:#0f1114; color:var(--text); width:100%; }
  [hidden] { display:none !important; }
  .hint { color:var(--muted); font-size:13px; margin:6px 0 0; }

  /* Стартовый экран */
  #start { max-width:440px; margin:0 auto; padding:48px 16px; }
  #start h1 { font-size:24px; margin:0 0 6px; }
  #start > p { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
  .card h2 { font-size:16px; margin:0 0 10px; }
  .card input + input, .card input + .row, .card .row + input { margin-top:8px; }
  .row { display:flex; gap:8px; }
  .row button { white-space:nowrap; }
  #status { color:var(--muted); min-height:1.4em; margin-top:8px; }
  #status.err { color:#ff8a85; }

  /* Экран звонка */
  #call { position:fixed; inset:0; display:grid; grid-template-rows:auto auto 1fr auto; }
  #top { padding:10px 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  #top .code { font-family:ui-monospace, Consolas, monospace; background:#0f1114; padding:6px 10px; border-radius:8px; user-select:all; }
  #top .grow { flex:1; }
  #state { color:var(--muted); }
  #net { color:var(--muted); font-size:12px; }
  #knock { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:10px 16px; background:#3a2f17; border-bottom:1px solid var(--accent); }
  #knock span { flex:1; min-width:180px; }
  #stage { position:relative; display:flex; min-height:0; }
  #videos { position:relative; flex:1; min-width:0; background:#000; }
  #main { width:100%; height:100%; object-fit:contain; background:#000; }
  #mainLabel { position:absolute; left:12px; top:10px; background:rgba(0,0,0,.55); padding:4px 10px; border-radius:8px; font-size:13px; }
  #thumbs { position:absolute; right:12px; bottom:12px; display:flex; gap:8px; }
  #thumbs video { width:180px; max-width:28vw; aspect-ratio:16/9; object-fit:cover; background:#222; border-radius:10px; border:2px solid var(--line); cursor:pointer; }
  #placeholder { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); text-align:center; padding:16px; }
  #chat { width:300px; border-left:1px solid var(--line); display:flex; flex-direction:column; background:var(--panel); }
  #msgs { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:6px; }
  .msg { max-width:85%; padding:7px 10px; border-radius:10px; background:#2a3038; word-wrap:break-word; white-space:pre-wrap; }
  .msg.me { align-self:flex-end; background:#4a3a1c; }
  .msg.sys { align-self:center; background:none; color:var(--muted); font-size:13px; text-align:center; }
  #chatForm { display:flex; gap:6px; padding:10px; border-top:1px solid var(--line); }
  #bar { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:12px 16px; border-top:1px solid var(--line); }

  /* Настройки */
  #settings { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; overflow-y:auto; }
  #settings .card { width:100%; max-width:420px; margin:auto; }
  #settings label { display:block; color:var(--muted); font-size:13px; margin:12px 0 4px; }
  #settings label.check { display:flex; gap:8px; align-items:flex-start; color:var(--text); font-size:14px; }
  #settings label.check input { width:auto; margin-top:3px; }
  #settings select { width:100%; font:inherit; padding:9px 10px; border-radius:10px; border:1px solid var(--line); background:#0f1114; color:var(--text); }
  #settings .row { justify-content:flex-end; margin-top:16px; }
  #micLevel { height:6px; border-radius:3px; background:#0f1114; margin-top:6px; overflow:hidden; }
  #micLevel div { height:100%; width:0; background:var(--green); transition:width .08s; }
  #preview { width:100%; aspect-ratio:16/9; object-fit:cover; background:#000; border-radius:10px; transform:scaleX(-1); }

  @media (max-width:720px) {
    #stage { flex-direction:column; }
    #chat { width:auto; height:38vh; border-left:0; border-top:1px solid var(--line); }
    #bar button { padding:9px 12px; }
  }
</style>
</head>
<body>

<div id="start">
  <h1>Звонок</h1>
  <p>Видео, голос, чат и демонстрация экрана. Соединение зашифровано, в комнату входят только с вашего разрешения.</p>

  <div class="card">
    <h2>Ваше имя</h2>
    <input id="name" maxlength="40" placeholder="Как вас называть">
  </div>

  <div class="card" id="createCard">
    <h2>Начать звонок</h2>
    <input id="createPass" type="password" maxlength="64" placeholder="Пароль на комнату (необязательно)" autocomplete="new-password">
    <p class="hint">Пароль сообщите собеседнику отдельно, не вместе со ссылкой.</p>
    <div class="row" style="margin-top:10px"><button class="primary" id="btnCreate">Создать комнату</button></div>
  </div>

  <div class="card">
    <h2 id="joinTitle">Подключиться по коду</h2>
    <div class="row">
      <input id="joinCode" placeholder="Код от собеседника" autocomplete="off">
    </div>
    <input id="joinPass" type="password" maxlength="64" placeholder="Пароль (если комната с паролем)" autocomplete="off">
    <div class="row" style="margin-top:10px"><button id="btnJoin">Войти</button></div>
  </div>
  <button id="btnCheck">⚙ Проверить микрофон и камеру</button>
  <div id="status"></div>
</div>

<div id="call" hidden>
  <div id="top">
    <span>Код:</span>
    <span class="code" id="roomCode"></span>
    <button id="btnCopy">Скопировать ссылку</button>
    <span class="grow"></span>
    <span id="state"></span>
    <span id="net"></span>
  </div>
  <div id="knock" hidden>
    <span id="knockText"></span>
    <button class="primary" id="knockYes">Впустить</button>
    <button id="knockNo">Отклонить</button>
  </div>
  <div id="stage">
    <div id="videos">
      <video id="main" autoplay playsinline muted></video>
      <div id="mainLabel" hidden></div>
      <div id="placeholder"></div>
      <div id="thumbs"></div>
    </div>
    <div id="chat">
      <div id="msgs"></div>
      <form id="chatForm">
        <input id="chatInput" placeholder="Сообщение" autocomplete="off">
        <button type="submit">➤</button>
      </form>
    </div>
  </div>
  <div id="bar">
    <button id="btnMic">🎙 Микрофон</button>
    <button id="btnCam">📷 Камера</button>
    <button id="btnScreen">🖥 Показать экран</button>
    <button id="btnChat">💬 Чат</button>
    <button id="btnSettings">⚙ Устройства</button>
    <button id="btnHang" class="off">Завершить</button>
  </div>
</div>

<div id="settings" hidden>
  <div class="card">
    <h2>Устройства</h2>
    <video id="preview" autoplay playsinline muted></video>
    <label for="micSel">🎙 Микрофон — скажите что-нибудь, полоска должна двигаться</label>
    <select id="micSel"></select>
    <div id="micLevel"><div></div></div>
    <div class="row" style="justify-content:flex-start;margin-top:8px">
      <button id="btnMicTest">⏺ Записать 3 сек и прослушать</button>
    </div>
    <label for="camSel">📷 Камера</label>
    <select id="camSel"></select>
    <label for="spkSel">🔊 Динамики / наушники</label>
    <select id="spkSel"></select>
    <label for="screenQ">🖥 Демонстрация экрана</label>
    <select id="screenQ">
      <option value="smooth">Плавно — 60 кадров/с, 1080p (игры, видео)</option>
      <option value="balance">Баланс — 30 кадров/с, 1080p</option>
      <option value="text">Чётко — 15 кадров/с, до 1440p (текст, код)</option>
    </select>
    <label class="check"><input type="checkbox" id="hideIp">
      <span>Скрывать мой IP даже от собеседника<br><span class="hint">Звонок пойдёт через сервер-посредник (TURN). Может не соединиться или работать медленнее. Применяется к следующему звонку.</span></span></label>
    <div class="row">
      <button id="btnSpkTest">Проверить звук</button>
      <button class="primary" id="btnSettingsClose">Готово</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const enc = new TextEncoder(), dec = new TextDecoder();

  /* Публичные MQTT-серверы для «знакомства» браузеров. Используются все сразу:
     достаточно, чтобы у обоих работал хотя бы один. */
  const BROKERS = [
    'wss://broker-cn.emqx.io:8084/mqtt',
    'wss://broker.emqx.io:8084/mqtt',
    'wss://broker.hivemq.com:8884/mqtt',
  ];

  /* Серверы для «пробивания» сетей (NAT). Если у кого-то не соединяется
     или вы хотите надёжно скрывать IP — добавьте свой TURN (бесплатно на
     metered.ca или Cloudflare), логин и пароль из их кабинета. */
  const ICE_SERVERS = [
    { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] },
    { urls: 'stun:stun.cloudflare.com:3478' },
    { urls: 'turn:eu-0.turn.peerjs.com:3478', username: 'peerjs', credential: 'peerjsp' },
    { urls: 'turn:us-0.turn.peerjs.com:3478', username: 'peerjs', credential: 'peerjsp' },
    // { urls: ['turn:АДРЕС:80', 'turn:АДРЕС:443?transport=tcp'], username: 'ЛОГИН', credential: 'ПАРОЛЬ' },
  ];

  /* ============================================================
     Мини-клиент MQTT 3.1.1 поверх WebSocket (без библиотек)
     ============================================================ */
  function Mqtt(url, onMsg, onState) {
    let ws = null, buf = new Uint8Array(0), ping = 0, closed = false, delay = 1000, pid = 1;
    const topics = new Set();
    const self = this;
    this.ok = false;
    const str = (s) => { const b = enc.encode(s); return [b.length >> 8, b.length & 255, ...b]; };
    function packet(type, body) {
      const hdr = [type]; let x = body.length;
      do { let d = x % 128; x = Math.floor(x / 128); if (x > 0) d |= 128; hdr.push(d); } while (x > 0);
      const out = new Uint8Array(hdr.length + body.length); out.set(hdr); out.set(body, hdr.length); return out;
    }
    const send = (p) => { if (ws && ws.readyState === 1) ws.send(p); };
    function sub(t) { const id = (pid++ & 0xffff) || 1; send(packet(0x82, [id >> 8, id & 255, ...str(t), 0])); }
    function connect() {
      if (closed) return;
      try { ws = new WebSocket(url, 'mqtt'); } catch (e) { retry(); return; }
      ws.binaryType = 'arraybuffer';
      buf = new Uint8Array(0);
      ws.onopen = () => send(packet(0x10, [...str('MQTT'), 4, 0x02, 0, 30, ...str('zv' + Math.random().toString(36).slice(2, 14))]));
      ws.onmessage = (e) => { const d = new Uint8Array(e.data); const n = new Uint8Array(buf.length + d.length); n.set(buf); n.set(d, buf.length); buf = n; parse(); };
      ws.onclose = () => { if (self.ok) { self.ok = false; onState(); } clearInterval(ping); retry(); };
      ws.onerror = () => {};
    }
    function retry() { if (!closed) { setTimeout(connect, delay); delay = Math.min(delay * 2, 15000); } }
    function parse() {
      while (buf.length >= 2) {
        let mult = 1, len = 0, i = 1, b;
        do { if (i >= buf.length) return; b = buf[i++]; len += (b & 127) * mult; mult *= 128; } while (b & 128);
        if (buf.length < i + len) return;
        const type = buf[0] >> 4, flags = buf[0] & 15, body = buf.slice(i, i + len);
        buf = buf.slice(i + len);
        if (type === 2) {            // CONNACK
          if (body[1] === 0) {
            self.ok = true; delay = 1000; topics.forEach(sub);
            clearInterval(ping); ping = setInterval(() => send(new Uint8Array([0xC0, 0])), 20000);
            onState();
          } else ws.close();
        } else if (type === 3) {     // PUBLISH
          const tl = (body[0] << 8) | body[1];
          const topic = dec.decode(body.subarray(2, 2 + tl));
          let p = 2 + tl; if ((flags >> 1) & 3) p += 2;
          onMsg(topic, body.slice(p));
        }
      }
    }
    this.subscribe = (t) => { topics.add(t); if (self.ok) sub(t); };
    this.publish = (t, payload) => {
      if (!self.ok) return false;
      const tb = str(t); const body = new Uint8Array(tb.length + payload.length);
      body.set(tb); body.set(payload, tb.length); send(packet(0x30, body)); return true;
    };
    this.close = () => { closed = true; clearInterval(ping); try { ws && ws.close(); } catch (e) {} };
    connect();
  }

  /* ============================================================
     Зашифрованный канал «знакомства»
     ============================================================ */
  const myId = Array.from(crypto.getRandomValues(new Uint8Array(8)), (b) => b.toString(16).padStart(2, '0')).join('');
  let key = null, topic = '', brokers = [], seq = 0;
  const lastSeq = {}, pendingRx = {};
  let rxChain = Promise.resolve();

  async function initSignal(code, pass) {
    const base = await crypto.subtle.importKey('raw', enc.encode('zvonok|' + code + '|' + pass), 'PBKDF2', false, ['deriveKey']);
    key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: enc.encode('zvonok-salt-v1'), iterations: 150000, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    const h = new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode('zvonok-topic|' + code)));
    topic = 'zvonok/v1/' + Array.from(h.slice(0, 20), (b) => b.toString(16).padStart(2, '0')).join('');
    brokers = BROKERS.map((u) => new Mqtt(u, (t, p) => { rxChain = rxChain.then(() => onRaw(t, p)); }, netState));
    brokers.forEach((b) => b.subscribe(topic));
  }

  async function signal(obj) {
    obj.from = myId; obj.seq = ++seq;
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj))));
    const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
    let sent = false;
    brokers.forEach((b) => { if (b.publish(topic, out)) sent = true; });
    return sent;
  }

  async function onRaw(t, payload) {
    if (t !== topic || payload.length < 29) return;
    let obj;
    try {
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: payload.slice(0, 12) }, key, payload.slice(12));
      obj = JSON.parse(dec.decode(pt));
    } catch (e) { return; } // чужой ключ (неверный пароль) — игнорируем
    if (!obj || typeof obj.from !== 'string' || obj.from === myId) return;
    if (obj.to && obj.to !== myId) return;
    // Одно и то же сообщение приходит через несколько серверов, и порядок может
    // перепутаться — выдаём строго по номеру.
    const f = obj.from;
    if (lastSeq[f] === undefined) lastSeq[f] = obj.seq - 1;
    if (obj.seq <= lastSeq[f]) return;
    (pendingRx[f] = pendingRx[f] || {})[obj.seq] = obj;
    drain(f);
    if (pendingRx[f] && Object.keys(pendingRx[f]).length) {
      setTimeout(() => { // сообщение потерялось везде — пропускаем дыру
        const keys = Object.keys(pendingRx[f] || {}).map(Number);
        if (keys.length) { lastSeq[f] = Math.min(...keys) - 1; drain(f); }
      }, 3000);
    }
  }
  function drain(f) {
    const q = pendingRx[f];
    while (q && q[lastSeq[f] + 1]) {
      const m = q[lastSeq[f] + 1]; delete q[lastSeq[f] + 1]; lastSeq[f]++;
      try { onSignal(m); } catch (e) { console.warn(e); }
    }
  }

  let netTimer = 0;
  function netState() {
    const n = brokers.filter((b) => b.ok).length;
    $('net').textContent = 'серверы ' + n + '/' + brokers.length;
    clearTimeout(netTimer);
    if (n === 0) netTimer = setTimeout(() => { if (!brokers.some((b) => b.ok) && !inCall()) setState('Нет связи с серверами — проверьте интернет'); }, 10000);
    if (n > 0 && role === 'guest' && !otherId) knock();
  }

  /* ============================================================
     Камера и микрофон
     ============================================================ */
  let localStream = null, screenStream = null;
  function blankVideoTrack() {
    const c = Object.assign(document.createElement('canvas'), { width: 320, height: 180 });
    const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, 320, 180);
    const t = c.captureStream(1).getVideoTracks()[0]; t.enabled = false; t._blank = true; return t;
  }
  function silentAudioTrack() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const t = ctx.createMediaStreamDestination().stream.getAudioTracks()[0]; t.enabled = false; t._blank = true; return t;
  }
  function loadDev() { try { return JSON.parse(localStorage.getItem('zvonok_dev') || '{}') || {}; } catch (e) { return {}; } }
  function saveDev(p) { try { localStorage.setItem('zvonok_dev', JSON.stringify(Object.assign(loadDev(), p))); } catch (e) {} }
  function audioC(id) { const c = { echoCancellation: true, noiseSuppression: true, autoGainControl: true }; if (id) c.deviceId = { exact: id }; return c; }
  function videoC(id) { const c = { width: 1280, height: 720 }; if (id) c.deviceId = { exact: id }; return c; }

  async function getLocalStream() {
    let s = null;
    const dev = loadDev();
    try { s = await navigator.mediaDevices.getUserMedia({ audio: audioC(dev.mic), video: videoC(dev.cam) }); }
    catch (e0) { if (dev.mic || dev.cam) { saveDev({ mic: '', cam: '' }); return getLocalStream(); } }
    if (!s) {
      try { s = await navigator.mediaDevices.getUserMedia({ audio: audioC() }); }
      catch (e) { s = new MediaStream(); }
      try { const v = await navigator.mediaDevices.getUserMedia({ video: videoC() }); v.getTracks().forEach((t) => s.addTrack(t)); } catch (e) {}
    }
    if (!s.getAudioTracks().length) s.addTrack(silentAudioTrack());
    if (!s.getVideoTracks().length) s.addTrack(blankVideoTrack());
    return s;
  }

  /* ============================================================
     Звонок
     ============================================================ */
  let role = '', code = '', myName = '', remoteName = 'Собеседник';
  let otherId = '', pc = null, dc = null, polite = false, makingOffer = false, ignoreOffer = false;
  let pendingCands = [], voiceSender = null, camSender = null, screenSenders = [];
  let voiceOut = null, camOut = null;
  let remoteStreams = {}, remoteMap = {}, remoteCamStream = null, remoteScreenStream = null, pinned = null;
  let knockTimer = 0, knockStarted = 0, knockQueue = [], answered = false;
  const inCall = () => !!pc;

  function status(t, err) { $('status').textContent = t || ''; $('status').className = err ? 'err' : ''; }
  function setState(t) { $('state').textContent = t; }
  function cleanCode(s) { return String(s || '').trim().toLowerCase().replace(/^.*[?&]room=/, '').replace(/[^a-z0-9]/g, ''); }
  function randomCode() {
    const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = '';
    for (const b of crypto.getRandomValues(new Uint8Array(10))) s += a[b % a.length];
    return s;
  }

  async function start(asHost, roomCode, pass) {
    myName = $('name').value.trim() || 'Гость';
    try { localStorage.setItem('zvonok_name', myName); } catch (e) {}
    if (!navigator.mediaDevices || !window.RTCPeerConnection) { status('Браузер не поддерживает звонки. Откройте страницу в Chrome, Edge, Яндекс или Firefox.', true); return; }
    if (!window.crypto || !crypto.subtle) { status('Откройте страницу по https://', true); return; }
    $('btnCreate').disabled = $('btnJoin').disabled = true;
    if (!localStream) { status('Включаем камеру и микрофон…'); localStream = await getLocalStream(); }
    status('Подключаемся…');
    role = asHost ? 'host' : 'guest'; code = roomCode;
    await initSignal(code, pass || '');
    showCall();
    if (asHost) {
      setState('Ждём собеседника…');
      $('placeholder').textContent = 'Отправьте собеседнику ссылку' + (pass ? ' и отдельно пароль' : '') + '. Когда он постучится — нажмите «Впустить».';
    } else {
      $('placeholder').textContent = 'Ждём, когда ведущий впустит вас…';
      knockStarted = Date.now();
      knock();
    }
  }

  /* --- Гость стучится, пока ведущий не ответит --- */
  function knock() {
    clearTimeout(knockTimer);
    if (role !== 'guest' || otherId) return;
    signal({ t: 'knock', name: myName });
    const waited = (Date.now() - knockStarted) / 1000;
    if (answered) setState('Ведущий получил запрос, ждём ответа…');
    else if (waited > 15) setState('Нет ответа. Возможно, ведущий ещё не открыл комнату или пароль неверный. Ждём…');
    else setState('Стучимся к ведущему…');
    knockTimer = setTimeout(knock, 3000);
  }

  function onSignal(m) {
    if (role === 'host') {
      if (m.t === 'knock') {
        if (otherId && otherId !== m.from) { signal({ t: 'busy', to: m.from }); return; }
        if (otherId === m.from) { signal({ t: 'accept', to: m.from, name: myName }); return; }
        signal({ t: 'wait', to: m.from });
        if (!knockQueue.some((k) => k.id === m.from)) { knockQueue.push({ id: m.from, name: String(m.name || 'Гость').slice(0, 40) }); showKnock(); }
        return;
      }
    } else {
      if (m.t === 'wait') { answered = true; return; }
      if (m.t === 'accept' && !otherId) {
        clearTimeout(knockTimer);
        otherId = m.from; remoteName = String(m.name || 'Собеседник').slice(0, 40);
        setState('Соединяемся…');
        createPC(true);
        return;
      }
      if (m.t === 'reject') { clearTimeout(knockTimer); setState('Ведущий не впустил вас.'); addSys('Ведущий отклонил запрос'); role = 'rejected'; return; }
      if (m.t === 'busy') { setState('В этой комнате уже идёт разговор.'); return; }
    }
    if (m.from !== otherId) return;
    if (m.t === 'sdp') onSdp(m.d, m.streams);
    else if (m.t === 'ice') onIce(m.c);
    else if (m.t === 'bye') { addSys(remoteName + ' завершил(а) звонок'); remoteGone(); }
  }

  /* --- Ведущий решает, впускать ли --- */
  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; g.gain.value = 0.08; o.connect(g).connect(ctx.destination);
      o.start(); setTimeout(() => { o.stop(); ctx.close(); }, 250);
    } catch (e) {}
  }
  function showKnock() {
    const k = knockQueue[0];
    if (!k) { $('knock').hidden = true; return; }
    $('knockText').textContent = '«' + k.name + '» хочет войти в звонок';
    if ($('knock').hidden) beep();
    $('knock').hidden = false;
  }
  $('knockYes').onclick = () => {
    const k = knockQueue.shift(); showKnock();
    if (!k || otherId) return;
    otherId = k.id; remoteName = k.name;
    signal({ t: 'accept', to: k.id, name: myName });
    knockQueue.splice(0).forEach((x) => signal({ t: 'busy', to: x.id })); showKnock();
    setState('Соединяемся…');
    createPC(false);
  };
  $('knockNo').onclick = () => { const k = knockQueue.shift(); if (k) signal({ t: 'reject', to: k.id }); showKnock(); };

  /* --- Соединение WebRTC ---
     Голос, камера и экран — отдельные потоки (свои stream id), поэтому
     браузер не «синхронизирует» звук с видео: если камера подвисла или
     переключается, голос идёт как шёл. */
  function createPC(isPolite) {
    polite = isPolite; makingOffer = false; ignoreOffer = false; pendingCands = [];
    remoteStreams = {}; remoteMap = {};
    const hideIp = loadDev().hideIp;
    pc = new RTCPeerConnection({ iceServers: ICE_SERVERS, iceTransportPolicy: hideIp ? 'relay' : 'all' });
    const myPc = pc;

    dc = pc.createDataChannel('chat', { negotiated: true, id: 0 });
    dc.onopen = () => { dc.send(JSON.stringify({ t: 'hello', name: myName })); };
    dc.onmessage = (e) => {
      let d; try { d = JSON.parse(e.data); } catch (x) { return; }
      if (d.t === 'hello') { remoteName = String(d.name || remoteName).slice(0, 40); addSys(remoteName + ' на связи'); layout(); }
      else if (d.t === 'msg') addMsg(String(d.text || '').slice(0, 2000), false);
      else if (d.t === 'bye') { addSys(remoteName + ' завершил(а) звонок'); remoteGone(); }
    };

    const a = localStream.getAudioTracks()[0], v = localStream.getVideoTracks()[0];
    voiceOut = new MediaStream([a]); camOut = new MediaStream([v]);
    voiceSender = pc.addTrack(a, voiceOut);
    camSender = pc.addTrack(v, camOut);
    try { const p = camSender.getParameters(); p.degradationPreference = 'maintain-framerate'; camSender.setParameters(p).catch(() => {}); } catch (e) {}
    screenSenders = [];
    if (screenStream) addScreenTracks();

    pc.onnegotiationneeded = async () => {
      try {
        makingOffer = true;
        await myPc.setLocalDescription();
        signal({ t: 'sdp', to: otherId, d: myPc.localDescription, streams: myStreams() });
      } catch (e) { console.warn(e); } finally { makingOffer = false; }
    };
    pc.onicecandidate = (e) => { if (e.candidate) signal({ t: 'ice', to: otherId, c: e.candidate }); };
    pc.ontrack = (e) => {
      const s = e.streams[0] || new MediaStream([e.track]);
      remoteStreams[s.id] = s;
      applyRemote();
    };
    let failTimer = 0;
    pc.onconnectionstatechange = () => {
      if (pc !== myPc) return;
      const st = pc.connectionState;
      clearTimeout(failTimer);
      if (st === 'connected') { setState(hideIp ? 'На связи (IP скрыт)' : 'На связи'); }
      else if (st === 'disconnected') { setState('Связь прерывается…'); failTimer = setTimeout(() => { if (pc === myPc && pc.connectionState !== 'connected') { if (!polite) pc.restartIce(); } }, 4000); }
      else if (st === 'failed') {
        setState(hideIp ? 'Не удалось соединиться через сервер-посредник. Отключите «Скрывать IP» в настройках.' : 'Переподключаемся…');
        if (!polite) pc.restartIce();
        failTimer = setTimeout(() => { if (pc === myPc && pc.connectionState === 'failed') { addSys('Связь потеряна'); remoteGone(); } }, 25000);
      }
    };
  }

  function myStreams() {
    return { voice: voiceOut && voiceOut.id, cam: camOut && camOut.id, screen: screenStream && screenSenders.length ? screenStream.id : null };
  }

  async function onSdp(d, streams) {
    if (!pc || !d) return;
    if (streams) { remoteMap = streams; applyRemote(); }
    const collision = d.type === 'offer' && (makingOffer || pc.signalingState !== 'stable');
    ignoreOffer = !polite && collision;
    if (ignoreOffer) return;
    try {
      await pc.setRemoteDescription(d);
      for (const c of pendingCands.splice(0)) await pc.addIceCandidate(c).catch(() => {});
      if (d.type === 'offer') {
        await pc.setLocalDescription();
        signal({ t: 'sdp', to: otherId, d: pc.localDescription, streams: myStreams() });
      }
    } catch (e) { console.warn(e); }
  }
  async function onIce(c) {
    if (!pc || !c) return;
    if (!pc.remoteDescription) { pendingCands.push(c); return; }
    try { await pc.addIceCandidate(c); } catch (e) { if (!ignoreOffer) console.warn(e); }
  }

  /* Раскладываем входящие потоки: голос → отдельный <audio>, камера и экран → видео */
  function applyRemote() {
    const voice = remoteStreams[remoteMap.voice];
    if (voice) playAudio(voiceAudio, voice);
    const cam = remoteStreams[remoteMap.cam] || null;
    const scr = remoteMap.screen ? remoteStreams[remoteMap.screen] || null : null;
    if (scr && !remoteScreenStream) { addSys(remoteName + ' показывает экран'); pinned = null; }
    if (!scr && remoteScreenStream) { addSys('Демонстрация экрана закончилась'); pinned = null; }
    remoteScreenStream = scr;
    playAudio(screenAudio, scr);
    if (cam) remoteCamStream = cam;
    if (cam || voice) $('placeholder').hidden = true;
    layout();
  }

  function remoteGone() {
    if (pc) { try { pc.close(); } catch (e) {} }
    pc = null; dc = null; otherId = '';
    remoteStreams = {}; remoteMap = {}; remoteCamStream = null; remoteScreenStream = null; pinned = null;
    playAudio(voiceAudio, null); playAudio(screenAudio, null);
    $('placeholder').hidden = false;
    if (role === 'host') {
      setState('Собеседник отключился. Он может снова войти по той же ссылке.');
      $('placeholder').textContent = 'Ждём собеседника. Когда он постучится — нажмите «Впустить».';
    } else if (role === 'guest') {
      $('placeholder').textContent = 'Связь прервалась. Стучимся к ведущему снова…';
      answered = false; knockStarted = Date.now(); knock();
    }
    layout();
  }

  /* ============================================================
     Звук: отдельные <audio>, которые не трогаются при перестановке видео
     ============================================================ */
  function makeAudio() { const a = document.createElement('audio'); a.autoplay = true; a.hidden = true; document.body.appendChild(a); return a; }
  const voiceAudio = makeAudio();
  const screenAudio = makeAudio();
  let audioHintShown = false;
  function playAudio(el, stream) {
    const s = stream && stream.getAudioTracks().length ? stream : null;
    if (el.srcObject !== s) el.srcObject = s;
    if (!s) return;
    const id = loadDev().spk; if (id && el.setSinkId) el.setSinkId(id).catch(() => {});
    if (el.paused) el.play().catch(() => {
      if (!audioHintShown) { audioHintShown = true; addSys('Нажмите в любом месте страницы, чтобы включить звук'); }
      document.addEventListener('click', () => { voiceAudio.play().catch(() => {}); screenAudio.play().catch(() => {}); }, { once: true });
    });
  }

  /* ============================================================
     Раскладка видео
     ============================================================ */
  const vids = {};
  function vid(k) {
    if (!vids[k]) { const v = document.createElement('video'); v.autoplay = true; v.playsInline = true; v.muted = true; vids[k] = v; }
    return vids[k];
  }
  function setSrc(v, s) { if (v.srcObject !== s) v.srcObject = s; }
  function layout() {
    if (!localStream) return;
    const items = [];
    if (remoteScreenStream) items.push({ key: 'rscreen', stream: remoteScreenStream, label: 'Экран: ' + remoteName });
    if (remoteCamStream) items.push({ key: 'rcam', stream: remoteCamStream, label: remoteName });
    if (screenStream) items.push({ key: 'myscreen', stream: screenStream, label: 'Ваш экран' });
    items.push({ key: 'me', stream: localStream, label: 'Вы' });
    const big = items.find((i) => i.key === pinned) || items[0];
    const main = $('main');
    main.muted = true;
    setSrc(main, big.stream);
    main.style.transform = big.key === 'me' ? 'scaleX(-1)' : '';
    $('mainLabel').textContent = big.label; $('mainLabel').hidden = false;
    const thumbs = $('thumbs'); thumbs.innerHTML = '';
    for (const it of items) {
      if (it === big) continue;
      const v = vid(it.key);
      setSrc(v, it.stream);
      v.style.transform = it.key === 'me' ? 'scaleX(-1)' : '';
      v.title = it.label + ' — нажмите, чтобы показать крупно';
      v.onclick = () => { pinned = it.key; layout(); };
      thumbs.appendChild(v);
      v.play().catch(() => {});
    }
    main.play().catch(() => {});
  }

  /* ============================================================
     Кнопки звонка
     ============================================================ */
  function trackBtn(btn, kind, label) {
    const cur = () => localStream.getTracks().find((x) => x.kind === kind);
    function paint() {
      const t = cur();
      if (!t || t._blank) { btn.disabled = true; btn.className = ''; btn.textContent = label + ': нет'; return; }
      btn.disabled = false;
      btn.className = t.enabled ? '' : 'off'; btn.textContent = label + (t.enabled ? '' : ' выкл.');
    }
    btn.onclick = () => { const t = cur(); if (t && !t._blank) { t.enabled = !t.enabled; paint(); } };
    btn._paint = paint;
    paint();
  }

  /* Качество демонстрации. «Плавно» — для игр и видео: держим кадры,
     при слабом интернете падает чёткость, а не FPS. */
  const SCREEN_Q = {
    smooth: { fps: 60, w: 1920, h: 1080, bitrate: 8000000, hint: 'motion', pref: 'maintain-framerate' },
    balance: { fps: 30, w: 1920, h: 1080, bitrate: 5000000, hint: 'motion', pref: 'balanced' },
    text: { fps: 15, w: 2560, h: 1440, bitrate: 4000000, hint: 'detail', pref: 'maintain-resolution' },
  };
  function addScreenTracks() {
    const q = SCREEN_Q[loadDev().screenQ] || SCREEN_Q.smooth;
    screenSenders = screenStream.getTracks().map((t) => {
      const s = pc.addTrack(t, screenStream);
      if (t.kind === 'video') {
        // По умолчанию браузер даёт видео ~2,5 Мбит/с — для 60 fps мало
        try {
          const p = s.getParameters();
          if (!p.encodings || !p.encodings.length) p.encodings = [{}];
          p.encodings[0].maxBitrate = q.bitrate;
          p.encodings[0].maxFramerate = q.fps;
          p.degradationPreference = q.pref;
          s.setParameters(p).catch(() => {});
        } catch (e) {}
      }
      return s;
    });
  }
  async function toggleScreen() {
    if (screenStream) { stopScreen(); return; }
    if (!navigator.mediaDevices.getDisplayMedia) { addSys('На этом устройстве показ экрана не поддерживается (обычно — телефон).'); return; }
    const q = SCREEN_Q[loadDev().screenQ] || SCREEN_Q.smooth;
    try {
      screenStream = await navigator.mediaDevices.getDisplayMedia({
        // Ограничиваем размер кадра: 4K-экран без ограничений съедает
        // гигабайты памяти и весь интернет, а выигрыша почти нет
        video: { frameRate: { ideal: q.fps, max: q.fps }, width: { max: q.w }, height: { max: q.h } },
        // restrictOwnAudio — не захватывать звук этой вкладки (голос собеседника),
        // иначе он вернётся ему эхом через звук демонстрации
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, restrictOwnAudio: true, suppressLocalAudioPlayback: false },
        systemAudio: 'include'
      });
    } catch (e) { screenStream = null; return; }
    const v = screenStream.getVideoTracks()[0];
    if (v) { v.contentHint = q.hint; v.onended = stopScreen; }
    if (pc) addScreenTracks();
    $('btnScreen').className = 'on'; $('btnScreen').textContent = '🖥 Остановить показ';
    addSys(pc ? 'Вы показываете экран' : 'Экран будет показан, когда собеседник подключится');
    layout();
  }
  function stopScreen() {
    if (!screenStream) return;
    screenStream.getTracks().forEach((t) => t.stop());
    screenStream = null;
    if (pc) screenSenders.forEach((s) => { try { pc.removeTrack(s); } catch (e) {} });
    screenSenders = [];
    $('btnScreen').className = ''; $('btnScreen').textContent = '🖥 Показать экран';
    if (pinned === 'myscreen') pinned = null;
    layout();
  }

  function hangUp() {
    try { if (dc && dc.readyState === 'open') dc.send(JSON.stringify({ t: 'bye' })); } catch (e) {}
    const done = () => {
      stopScreen();
      if (localStream) localStream.getTracks().forEach((t) => t.stop());
      if (pc) pc.close();
      brokers.forEach((b) => b.close());
      location.href = location.pathname;
    };
    if (otherId && key) signal({ t: 'bye', to: otherId }).finally(() => setTimeout(done, 300)); else done();
  }

  function addMsg(text, me) {
    const d = document.createElement('div'); d.className = 'msg' + (me ? ' me' : ''); d.textContent = text;
    $('msgs').appendChild(d); $('msgs').scrollTop = 1e9;
    if (!me && $('chat').hidden) $('btnChat').className = 'on';
  }
  function addSys(text) {
    const d = document.createElement('div'); d.className = 'msg sys'; d.textContent = text;
    $('msgs').appendChild(d); $('msgs').scrollTop = 1e9;
  }

  function showCall() {
    $('start').hidden = true; $('call').hidden = false;
    $('roomCode').textContent = code;
    const link = /^https?:$/.test(location.protocol) ? location.origin + location.pathname + '?room=' + code : '';
    const label = link ? 'Скопировать ссылку' : 'Скопировать код';
    $('btnCopy').textContent = label;
    $('btnCopy').hidden = role !== 'host';
    $('btnCopy').onclick = () => {
      const txt = link || code;
      const ok = () => { $('btnCopy').textContent = 'Скопировано ✓'; setTimeout(() => { $('btnCopy').textContent = label; }, 1500); };
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, () => addSys('Ссылка: ' + txt));
      else addSys('Ссылка: ' + txt);
    };
    trackBtn($('btnMic'), 'audio', '🎙 Микрофон');
    trackBtn($('btnCam'), 'video', '📷 Камера');
    $('btnScreen').hidden = !navigator.mediaDevices.getDisplayMedia;
    $('btnScreen').onclick = toggleScreen;
    $('btnHang').onclick = hangUp;
    $('btnChat').onclick = () => { $('chat').hidden = !$('chat').hidden; $('btnChat').className = ''; };
    if (matchMedia('(max-width:720px)').matches) $('chat').hidden = true;
    netState();
    layout();
  }

  $('chatForm').onsubmit = (e) => {
    e.preventDefault();
    const text = $('chatInput').value.trim();
    if (!text) return;
    if (!dc || dc.readyState !== 'open') { addSys('Собеседник ещё не подключился'); return; }
    dc.send(JSON.stringify({ t: 'msg', text })); addMsg(text, true); $('chatInput').value = '';
  };

  /* ============================================================
     Настройки устройств
     ============================================================ */
  async function fillDevices() {
    let list = [];
    try { list = await navigator.mediaDevices.enumerateDevices(); } catch (e) {}
    const curId = (kind) => { const t = localStream && localStream.getTracks().find((x) => x.kind === kind && !x._blank); return t ? (t.getSettings().deviceId || '') : ''; };
    const fill = (sel, kind, chosen, none, word) => {
      const items = list.filter((d) => d.kind === kind);
      sel.innerHTML = '';
      if (!items.length) { sel.add(new Option(none, '')); sel.disabled = true; return; }
      sel.disabled = false;
      items.forEach((d, i) => sel.add(new Option(d.label || (word + ' ' + (i + 1)), d.deviceId)));
      if (chosen && items.some((d) => d.deviceId === chosen)) sel.value = chosen;
    };
    fill($('micSel'), 'audioinput', curId('audio'), 'Микрофонов нет', 'Микрофон');
    fill($('camSel'), 'videoinput', curId('video'), 'Камер нет', 'Камера');
    const canSink = 'setSinkId' in HTMLMediaElement.prototype;
    fill($('spkSel'), 'audiooutput', loadDev().spk, canSink ? 'Устройство по умолчанию' : 'Выбор недоступен в этом браузере', 'Динамики');
    if (!canSink) $('spkSel').disabled = true;
    $('hideIp').checked = !!loadDev().hideIp;
    $('screenQ').value = SCREEN_Q[loadDev().screenQ] ? loadDev().screenQ : 'smooth';
  }

  async function switchDevice(kind, deviceId) {
    let fresh;
    try {
      const s = await navigator.mediaDevices.getUserMedia(kind === 'audio' ? { audio: audioC(deviceId) } : { video: videoC(deviceId) });
      fresh = s.getTracks()[0];
    } catch (e) { addSys('Не удалось включить устройство: ' + (e.message || e.name)); fillDevices(); return; }
    const old = localStream.getTracks().find((x) => x.kind === kind);
    if (old) { fresh.enabled = old._blank ? true : old.enabled; localStream.removeTrack(old); old.stop(); }
    localStream.addTrack(fresh);
    // Подменяем дорожку в идущем звонке — без переподключения
    const sender = kind === 'audio' ? voiceSender : camSender;
    if (pc && sender) sender.replaceTrack(fresh).catch((e) => console.warn(e));
    saveDev(kind === 'audio' ? { mic: deviceId } : { cam: deviceId });
    $('btnMic')._paint && $('btnMic')._paint();
    $('btnCam')._paint && $('btnCam')._paint();
    if (kind === 'audio') watchMic();
    [$('main'), vids.me, $('preview')].forEach((v) => { if (v && v.srcObject === localStream) { v.srcObject = null; v.srcObject = localStream; v.play().catch(() => {}); } });
  }

  function applySpeaker() {
    const id = loadDev().spk || '';
    document.querySelectorAll('audio').forEach((v) => { if (v.setSinkId) v.setSinkId(id).catch(() => {}); });
  }

  let meterCtx = null, meterRaf = 0;
  function watchMic() {
    cancelAnimationFrame(meterRaf);
    if (meterCtx) { meterCtx.close().catch(() => {}); meterCtx = null; }
    if ($('settings').hidden) return;
    const t = localStream && localStream.getAudioTracks().find((x) => !x._blank);
    if (!t) return;
    meterCtx = new (window.AudioContext || window.webkitAudioContext)();
    const an = meterCtx.createAnalyser(); an.fftSize = 512;
    meterCtx.createMediaStreamSource(new MediaStream([t])).connect(an);
    const buf = new Uint8Array(an.fftSize);
    const bar = $('micLevel').firstElementChild;
    (function tick() {
      an.getByteTimeDomainData(buf);
      let peak = 0; for (const b of buf) peak = Math.max(peak, Math.abs(b - 128));
      bar.style.width = Math.min(100, peak / 64 * 100) + '%';
      meterRaf = requestAnimationFrame(tick);
    })();
  }

  function testSpeaker() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const dst = ctx.createMediaStreamDestination();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.frequency.value = 660; g.gain.value = 0.15; o.connect(g).connect(dst);
    const a = new Audio(); a.srcObject = dst.stream;
    const id = loadDev().spk; if (id && a.setSinkId) a.setSinkId(id).catch(() => {});
    a.play().catch(() => {}); o.start();
    setTimeout(() => { o.stop(); ctx.close(); a.srcObject = null; }, 700);
  }

  function testMic() {
    const t = localStream && localStream.getAudioTracks().find((x) => !x._blank);
    const btn = $('btnMicTest');
    if (!t || !window.MediaRecorder) { btn.textContent = 'Микрофон не найден'; return; }
    const rec = new MediaRecorder(new MediaStream([t]));
    const parts = [];
    rec.ondataavailable = (e) => { if (e.data.size) parts.push(e.data); };
    rec.onstop = () => {
      const url = URL.createObjectURL(new Blob(parts, { type: rec.mimeType }));
      const a = new Audio(url);
      const id = loadDev().spk; if (id && a.setSinkId) a.setSinkId(id).catch(() => {});
      btn.textContent = '🔊 Воспроизведение…';
      a.onended = a.onerror = () => { URL.revokeObjectURL(url); btn.disabled = false; btn.textContent = '⏺ Записать 3 сек и прослушать'; };
      a.play().catch(() => a.onended());
    };
    btn.disabled = true; btn.textContent = '🔴 Говорите… 3';
    rec.start();
    let n = 3;
    const iv = setInterval(() => { n--; if (n > 0) btn.textContent = '🔴 Говорите… ' + n; else { clearInterval(iv); rec.stop(); } }, 1000);
  }

  async function openSettings() {
    if (!localStream) {
      if (!navigator.mediaDevices) { status('Браузер не поддерживает звонки.', true); return; }
      status('Включаем камеру и микрофон…');
      localStream = await getLocalStream();
      status('');
    }
    $('settings').hidden = false;
    $('preview').srcObject = localStream; $('preview').play().catch(() => {});
    fillDevices(); watchMic();
  }
  function closeSettings() { $('settings').hidden = true; $('preview').srcObject = null; watchMic(); }
  $('btnSettings').onclick = openSettings;
  $('btnCheck').onclick = openSettings;
  $('btnMicTest').onclick = testMic;
  $('btnSettingsClose').onclick = closeSettings;
  $('settings').onclick = (e) => { if (e.target === $('settings')) closeSettings(); };
  $('micSel').onchange = (e) => switchDevice('audio', e.target.value);
  $('camSel').onchange = (e) => switchDevice('video', e.target.value);
  $('spkSel').onchange = (e) => { saveDev({ spk: e.target.value }); applySpeaker(); };
  $('hideIp').onchange = (e) => saveDev({ hideIp: e.target.checked });
  $('screenQ').onchange = (e) => saveDev({ screenQ: e.target.value });
  $('btnSpkTest').onclick = testSpeaker;
  if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) navigator.mediaDevices.addEventListener('devicechange', () => { if (!$('settings').hidden) fillDevices(); });

  /* ============================================================
     Стартовый экран
     ============================================================ */
  try { $('name').value = localStorage.getItem('zvonok_name') || ''; } catch (e) {}
  const initialCode = cleanCode(new URLSearchParams(location.search).get('room'));
  if (initialCode) {
    $('joinCode').value = initialCode;
    $('createCard').hidden = true;
    $('joinTitle').textContent = 'Вход в звонок';
    $('btnJoin').className = 'primary';
    $('btnJoin').textContent = 'Войти в звонок';
    document.querySelector('#start > p').textContent = 'Вас пригласили в звонок. Введите имя и нажмите «Войти в звонок». Ведущий увидит ваше имя и впустит вас.';
  }
  $('btnCreate').onclick = () => start(true, randomCode(), $('createPass').value);
  $('btnJoin').onclick = () => {
    const c = cleanCode($('joinCode').value);
    if (!c) { status('Введите код комнаты.', true); return; }
    start(false, c, $('joinPass').value);
  };
  ['joinCode', 'joinPass'].forEach((id) => $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnJoin').click(); }));
  window.addEventListener('beforeunload', () => {
    try { if (dc && dc.readyState === 'open') dc.send(JSON.stringify({ t: 'bye' })); } catch (e) {}
  });
})();
</script>
